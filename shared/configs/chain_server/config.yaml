retriever_port: "http://catalog-retriever:8010"
memory_port: "http://memory-retriever:8011"
rails_port: "http://rails:8012"
memory_length: 16384
top_k_retrieve: 4
deepagents_recursion_limit: 24
deepagents_execution_timeout_seconds: 55.0
# Reserved for the grounding editor. The agent loop gets the remainder, so it
# cannot spend the whole turn and leave the editor zero seconds. Measured
# 2026-08-04: editor p90 12.5s, agent loop p90 39.8s against a 45s total, with
# six turns consuming the entire budget.
grounding_editor_reserve_seconds: 15.0
max_catalog_searches_per_turn: 3
max_product_detail_reads_per_turn: 2
expose_agent_diagnostics: false
catalog_search_timeout_seconds: null
weather:
  enabled: false
  provider: visual_crossing
  base_url: "https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline"
  api_key_env: WEATHER_API_KEY
  timeout_seconds: 3.0
  max_forecast_horizon_days: 15
  max_range_days: 15
multimodal: True
media_input:
  enabled: true
  allow_mixed_media: true
  max_images_per_turn: 1
  max_videos_per_turn: 1
  image_mime_types:
    - "image/jpeg"
    - "image/png"
  video_mime_types:
    - "video/mp4"
  max_image_bytes: 10485760
  max_video_bytes: 52428800
  max_video_duration_seconds: 120
guardrails_enabled: true
unsafe_message: "Sorry, I am a shopping assistant that specializes in apparel. Do you have any questions that align better with my expertise?"
