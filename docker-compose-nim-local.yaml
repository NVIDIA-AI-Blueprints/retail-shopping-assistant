services:

  nemotron:
    image: nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:2.0.4
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      # qwen3_coder, not pythonic: this image emits XML-form tool calls
      # (<tool_call><function=><parameter=>), which the pythonic parser cannot
      # read at all -- vLLM then returns the call as ordinary text with no
      # tool_calls, so the agent silently answers without ever calling a tool.
      # Of the parsers that do read that form, only qwen3_coder json-decodes
      # array and object arguments; qwen3_xml returns them as raw strings, which
      # fails validation for every structured tool this app defines.
      - NIM_PASSTHROUGH_ARGS=${NIM_PASSTHROUGH_ARGS:---enable-auto-tool-choice --tool-call-parser qwen3_coder --max-num-seqs 256}
      # Set explicitly, because unset does not mean "default on" -- it means vLLM
      # chooses, and vLLM disables prefix caching for every model whose attention
      # type is hybrid, calling the feature experimental. It does not consult the
      # model, even though NemotronHForCausalLM declares SupportsMambaPrefixCaching.
      # This model is hybrid, so it is caught by that blanket rule and the shared
      # prefix of every agent call is prefilled again from scratch.
      #
      # Worth caring about here because an agent turn makes several model calls
      # that each re-send the same system prompt, tool schemas and conversation,
      # so most of each prompt is text the engine processed moments earlier.
      #
      # Confirm it took effect -- the engine publishes what it resolved, which is
      # not always what was asked for:
      #   curl -s localhost:8000/metrics | grep cache_config_info
      # Expect enable_prefix_caching="True", and mamba_block_size to drop to the
      # attention block size, which is what makes the recurrent state reusable.
      #
      # Set to 0 to compare against, or if a future image regresses here.
      - NIM_ENABLE_KV_CACHE_REUSE=${NIM_ENABLE_KV_CACHE_REUSE:-1}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0','1']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  nvclip:
    image: nvcr.io/nim/nvidia/nvclip:2.0.0
    ports:
      - "8002:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  nemotron-omni:
    image: nvcr.io/nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:latest
    ports:
      - "8005:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    shm_size: "32gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0','1']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  embedqa:
    # Per the published self-hosted deploy for nemotron-3-embed-1b:
    #   https://build.nvidia.com/nvidia/nemotron-3-embed-1b/deploy?nim=self-hosted
    image: nvcr.io/nim/nvidia/nemotron-3-embed-1b:latest
    shm_size: "16gb"
    ports:
      - "8001:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
  content:
    image: nvcr.io/nim/nvidia/llama-3.1-nemoguard-8b-content-safety:1.10.1
    ports:
      - "8003:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_KVCACHE_PERCENT=.4
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  topic_control:
    image: nvcr.io/nim/nvidia/llama-3.1-nemoguard-8b-topic-control:1.0.0
    ports:
      - "8004:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_KVCACHE_PERCENT=.4
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

networks:
  shopping-network:
    driver: bridge
    name: retail-shopping-assistant_shopping-network
