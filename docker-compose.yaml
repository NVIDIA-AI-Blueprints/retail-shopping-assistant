services:
  # Chain Server - using bridge networking with port mapping
  chain-server:
    build:
      context: ./chain_server
      args:
        # false by default: Relay reads prompts, completions and cart
        # contents, so the shipped image does not carry a library that can
        # export them. Installing it is a deliberate act.
        INSTALL_RELAY: ${INSTALL_RELAY:-false}
    container_name: chain-server
    ports:
      - "8009:8009"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - VLM_API_KEY=${VLM_API_KEY:-${NVIDIA_API_KEY:-}}
      - VLM_BASE_URL=${VLM_BASE_URL:-}
      - VLM_MODEL=${VLM_MODEL:-}
      - CATALOG_RETRIEVER_URL=http://catalog-retriever:8010
      - MEMORY_RETRIEVER_URL=http://memory-retriever:8011
      - GUARDRAILS_ENABLED=${GUARDRAILS_ENABLED:-false}
      - CHECKPOINT_STORE=${CHECKPOINT_STORE-memory}
      - DEEPAGENTS_EXECUTION_TIMEOUT_SECONDS=${DEEPAGENTS_EXECUTION_TIMEOUT_SECONDS:-45}
      - CHAIN_SERVER_RELOAD=${CHAIN_SERVER_RELOAD:-false}
      - SHUTDOWN_GRACE_SECONDS=${SHUTDOWN_GRACE_SECONDS:-160}
      - EXPOSE_AGENT_DIAGNOSTICS=${EXPOSE_AGENT_DIAGNOSTICS:-false}
      - RELAY_ENABLED=${RELAY_ENABLED:-false}
      - WEATHER_ENABLED=${WEATHER_ENABLED:-false}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      # Unset by default: no endpoint means no exporter and no instrumentation.
      # Set it to http://otel-collector:4318 to trace.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chain-server}
    volumes:
      - ./shared:/app/shared
    depends_on:
      - catalog-retriever
      - memory-retriever
      - rails
    networks:
      - shopping-network

  # Catalog Indexer - builds the vector index, then exits.
  #
  # Indexing is deliberately not done by the serving container: rebuilding
  # starts by dropping the collection, so exactly one process may do it at a
  # time. This one-shot service is the Compose equivalent of the
  # `parallelism: 1` Job that docs/DEPLOYMENT.md prescribes for Kubernetes, and
  # it is what makes `docker compose up` sufficient on its own.
  #
  # Two things keep it to a single run, which is the whole contract:
  #
  #  - `container_name` pins it to one container. Compose refuses to scale a
  #    service that has one, so `--scale catalog-indexer=N` cannot start a
  #    second indexer; it warns and leaves the single container alone.
  #  - The fingerprint check makes repeat runs free. Bringing the stack up
  #    again re-runs this service, which compares the catalog fingerprint and
  #    exits without touching Milvus when the index is already current.
  #
  # Neither of those is a distributed lock, and this process cannot provide one
  # -- a lock across replicas needs somewhere to live. Scaling out horizontally
  # means Kubernetes, where the indexing Job's `parallelism: 1` is the
  # guarantee and the serving replicas stay unready until it succeeds.
  catalog-indexer:
    build:
      context: ./catalog_retriever
    container_name: catalog-indexer
    command: ["python", "-m", "app.index_catalog"]
    restart: "no"
    environment:
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - TEXT_EMBED_BASE_URL=${TEXT_EMBED_BASE_URL:-}
      - TEXT_EMBED_MODEL=${TEXT_EMBED_MODEL:-}
      - IMAGE_EMBED_BASE_URL=${IMAGE_EMBED_BASE_URL:-}
      - IMAGE_EMBED_MODEL=${IMAGE_EMBED_MODEL:-}
      - CATALOG_DATA_SOURCE=${CATALOG_DATA_SOURCE:-}
      - CATALOG_SCHEMA_SOURCE=${CATALOG_SCHEMA_SOURCE:-}
      - CATALOG_IMAGE_EMBEDDING_ENABLED=${CATALOG_IMAGE_EMBEDDING_ENABLED:-false}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    volumes:
      - ./shared:/app/shared
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - shopping-network

  # Catalog Retriever
  catalog-retriever:
    build:
      context: ./catalog_retriever
    container_name: catalog-retriever
    ports:
      - "8010:8010"
    environment:
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - TEXT_EMBED_BASE_URL=${TEXT_EMBED_BASE_URL:-}
      - TEXT_EMBED_MODEL=${TEXT_EMBED_MODEL:-}
      - IMAGE_EMBED_BASE_URL=${IMAGE_EMBED_BASE_URL:-}
      - IMAGE_EMBED_MODEL=${IMAGE_EMBED_MODEL:-}
      - CATALOG_DATA_SOURCE=${CATALOG_DATA_SOURCE:-}
      - CATALOG_SCHEMA_SOURCE=${CATALOG_SCHEMA_SOURCE:-}
      - CATALOG_IMAGE_EMBEDDING_ENABLED=${CATALOG_IMAGE_EMBEDDING_ENABLED:-false}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    volumes:
      - ./shared:/app/shared
    depends_on:
      milvus:
        condition: service_healthy
      # Waiting for a successful exit is what keeps this container from serving
      # empty searches against a missing index. It also means the server binds
      # its Milvus collections after they exist, rather than holding a handle
      # from before the indexer created them.
      catalog-indexer:
        condition: service_completed_successfully
    networks:
      - shopping-network

  # Postgres for the memory service. Opt-in: `--profile postgres` starts it,
  # and MEMORY_DATABASE_URL below decides whether anything uses it. SQLite stays
  # the default so local work and the test suite need nothing running.
  #
  # This is what removes the last two ceilings. A SQLite file has one writer, and
  # the volume holding it can be mounted by one pod, so no amount of CPU or
  # replicas changes either. Neither is a tuning limit.
  memory-db:
    image: postgres:16-alpine
    container_name: memory-db
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=${MEMORY_DB_USER:-memory}
      - POSTGRES_PASSWORD=${MEMORY_DB_PASSWORD:-memory}
      - POSTGRES_DB=${MEMORY_DB_NAME:-memory}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The service must not start migrating against a database still
      # initialising; compose has no other way to know the difference.
      test: ["CMD-SHELL", "pg_isready -U ${MEMORY_DB_USER:-memory}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shopping-network

  # Memory Retriever
  memory-retriever:
    build:
      context: ./memory_retriever
    container_name: memory-retriever
    ports:
      - "127.0.0.1:8011:8011"
    environment:
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-sqlite:////data/context.db}
      - MEMORY_SQLITE_BUSY_TIMEOUT_MS=${MEMORY_SQLITE_BUSY_TIMEOUT_MS:-5000}
      - MEMORY_MAX_CONCURRENT_REQUESTS=${MEMORY_MAX_CONCURRENT_REQUESTS:-64}
      - SHUTDOWN_GRACE_SECONDS=${SHUTDOWN_GRACE_SECONDS:-30}
      - MEMORY_TURN_ABANDON_SECONDS=${MEMORY_TURN_ABANDON_SECONDS:-300}
      - MEMORY_RECENT_TURNS=${MEMORY_RECENT_TURNS:-8}
    volumes:
      - ./shared:/app/shared
      - memory-data:/data
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - shopping-network

  # Rails
  rails:
    build:
      context: ./guardrails
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - RAIL_API_KEY=${RAIL_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - RAILS_BASE_URL=${RAILS_BASE_URL:-}
      - RAILS_CONTENT_BASE_URL=${RAILS_CONTENT_BASE_URL:-}
      - RAILS_TOPIC_BASE_URL=${RAILS_TOPIC_BASE_URL:-}
    container_name: rails
    ports:
      - "8012:8012"
    volumes:
      - ./shared:/app/shared
    networks:
      - shopping-network

  # Frontend
  frontend:
    build:
      context: ./ui
    container_name: shopping-frontend
    # Remove the ports section - nginx will handle external access
    # ports:
    #   - "3000:3000"
    volumes:
      - ./shared:/app/shared
    depends_on:
      - chain-server
    networks:
      - shopping-network

  # etcd - using bridge networking
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    ports:
      - "2379:2379"
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./catalog_retriever/volumes/etcd:/etcd
    command: [
      "etcd",
      "--advertise-client-urls=http://etcd:2379",
      "--listen-client-urls=http://0.0.0.0:2379",
      "--data-dir=/etcd"
    ]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopping-network

  # Minio - using bridge networking
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./catalog_retriever/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopping-network

  # Milvus - bridge mode, talking to etcd and minio via service names
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.13-hotfix
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      COMMON_STORAGETYPE: local
    volumes:
      - ./catalog_retriever/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shopping-network

  # Nginx Proxy
  nginx:
    image: nginx:1.25.3-alpine
    container_name: nginx-proxy
    ports:
      - "3000:80"  # Brev will expose this port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - chain-server
    networks:
      - shopping-network

  # OpenTelemetry Collector - the seam between the app and any trace backend.
  # The chain server exports OTLP here and knows nothing else; changing where
  # traces land is a change to otel-collector-config.yaml, not to any service.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    # Published on loopback so a chain server run as a local process -- which is
    # how the local runner starts it -- can reach the collector. Inside compose
    # the service name resolves without this.
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - phoenix
    networks:
      - shopping-network

  # Arize Phoenix - trace viewer. Loopback-only: it is an operator surface and
  # holds conversation content, following memory-retriever's precedent rather
  # than the all-interfaces default.
  phoenix:
    image: arizephoenix/phoenix:version-19.19.0
    container_name: phoenix
    ports:
      # All interfaces, matching the UI, so a tunnel can reach it. Phoenix holds
      # conversation content, so on anything but a dev box this wants to go back
      # to loopback with access through the tunnel only.
      - "6006:6006"
    volumes:
      - phoenix-data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    networks:
      - shopping-network

networks:
  shopping-network:
    driver: bridge
    name: retail-shopping-assistant_shopping-network
    external: false

volumes:
  memory-data:
  memory-pgdata:
  phoenix-data:
