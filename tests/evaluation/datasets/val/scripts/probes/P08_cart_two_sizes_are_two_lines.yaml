id: P08_cart_two_sizes_are_two_lines
covers: [cart-management, sizes]
why: >
  A size is a line, not a quantity, and a size the shopper gave to filter a
  search is their size. Reversing the first emptied a cart; asking again for a
  size they had just said made them repeat themselves.
turns:
  - say: show me black dresses in a size 2
    expect:
      products_min: 1
      every_product: {primary_color: black}

  - say: add the Black Satin Lace-Up Dress to my cart
    expect:
      cart:
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}

  - say: size 2
    expect:
      cart:
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}

  - say: actually add it in a 4 as well
    expect:
      cart:
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}
        - {name: Black Satin Lace-Up Dress, size: "4", qty: 1}
