id: P18_reference_by_full_name
covers: [references, cart-management]
why: >
  The commonest correct add. An earlier gate compared the shopper's words to
  the catalog name exactly, so the article in "the Southwest Bracelet" refused
  a product called "Southwest Bracelet".
turns:
  - say: show me some bracelets
    expect:
      products_min: 2
      every_product: {subcategory: bracelets}
  - say: add the Southwest Bracelet to my cart
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
