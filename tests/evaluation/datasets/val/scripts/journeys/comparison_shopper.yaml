id: comparison_shopper
covers: [discovery, memory, honesty, cart-management]
why: >
  A shopper who compares before buying. Material and care are catalog facts and
  must come from the record; a price quoted from an earlier turn is history,
  not a current claim.
turns:
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}
  - say: what are the first two made of
    expect: {cart_unchanged: true}
  - say: how do I care for them
    expect: {}
  - say: which is better value for wearing often
    expect: {}
  - say: what did the first one cost again
    expect: {}
  - say: are either of them available in a 2
    expect: {}
  - say: add the Black Satin Lace-Up Dress in a 2
    expect:
      cart: [{name: Black Satin Lace-Up Dress, size: "2", qty: 1}]
  - say: what's in my cart
    expect:
      cart: [{name: Black Satin Lace-Up Dress, size: "2", qty: 1}]
