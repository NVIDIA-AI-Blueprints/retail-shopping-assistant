set_name: Atomic cross-subject weather scope and pending location completion
shopper_profile_id: shopper_jordan
queries:
  - >-
    Give me weather-based styling guidance for my outdoor NYC wedding on
    Friday next week. I’m not shopping for products yet.
  - >-
    I also have a conference on Sunday next week. It will be outdoors; give me
    weather-aware styling before products.
  - "Seattle."
answers:
  - >-
    Resolve both weather-scope components atomically from revision zero: set
    the shopper-provided NYC location and set Friday next week. Call weather
    once through the server-bound zero-argument tool and give concise outdoor
    guidance grounded in that forecast. Ask no venue, location, or date
    question and run no catalog tool.
  - >-
    Treat the conference as a different weather-planning subject. Against the
    exact current scope revision, clear the wedding location and set only
    Sunday next week. The resulting scope has no location, so do not call or
    reuse weather. Give one conditional styling direction and ask only for the
    conference location; do not mention NYC, prior forecast facts, products, or
    venue.
  - >-
    Treat Seattle as fulfillment of the conference-location question. Against
    the exact current scope revision, set Seattle and retain the already bound
    conference date. Call weather once through the server-bound zero-argument
    tool and give concise outdoor conference guidance from that current
    forecast. Do not reuse or mention NYC, ask another question, or search for
    products.
diagnostic_expectations:
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: none
    required_weather_scope:
      scope_revision: 0
      location_action: set
      window_action: set
      location_source: shopper_provided_location
      location_supplied: true
      date_supplied: true
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_tools: [get_weather_forecast_tool]
    required_business_sequence: [get_weather_forecast_tool]
    forbidden_tools:
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 1
    required_weather_trace:
      request_shape: relative_exact_date
      location_source: shopper_provided_location
      provider_input: location_query
      outcome: success
    required_weather_receipt_status: promotion_prepared
    required_response_phrases:
      - Weather Data Provided by Visual Crossing
    forbidden_response_phrases:
      - usual area
      - product options
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: event_location
    required_weather_scope:
      scope_revision: 1
      location_action: clear
      window_action: set
      location_source: null
      location_supplied: false
      date_supplied: true
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_business_sequence: []
    forbidden_tools:
      - get_weather_forecast_tool
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 0
    required_response_phrases:
      - "?"
    forbidden_response_phrases:
      - NYC
      - Weather Data Provided by Visual Crossing
      - "°F"
      - drizzle
      - rain
      - temperature
      - damp
      - chilly
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: none
    required_weather_scope:
      scope_revision: 2
      location_action: set
      window_action: retain
      location_source: shopper_provided_location
      location_supplied: true
      date_supplied: false
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_tools: [get_weather_forecast_tool]
    required_business_sequence: [get_weather_forecast_tool]
    forbidden_tools:
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 1
    required_weather_trace:
      request_shape: exact_date
      location_source: shopper_provided_location
      provider_input: location_query
      outcome: success
    required_weather_receipt_status: promotion_prepared
    required_response_phrases:
      - Seattle
      - Weather Data Provided by Visual Crossing
    forbidden_response_phrases:
      - NYC
      - wedding
