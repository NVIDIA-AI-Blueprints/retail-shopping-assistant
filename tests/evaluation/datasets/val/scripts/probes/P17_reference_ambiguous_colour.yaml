id: P17_reference_ambiguous_colour
covers: [references, cart-management]
why: >
  Shown several black dresses, "the black one" names none of them. The
  assistant used to pick one -- reaching fourteen turns back for a navy dress
  in half the runs -- and every check passed, because the reference resolved
  correctly to the wrong product.
turns:
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}

  - say: now show me black heels
    expect:
      products_min: 1

  - say: add the black one in a size 8
    expect:
      cart_unchanged: true            # ask which; never choose
      tools_not_used: [add_cart_items_tool]
