id: J04_colour_ambiguity
covers: [references, cart-management, discovery]
why: >
  A conversation full of black things. "The black one" is a description that
  fits several, and the assistant used to pick one silently -- reaching
  fourteen turns back for a navy dress in half the runs.
  Names Polished Pearl Pumps, not Polished Pearl Pumps: this catalog gives that
  second name to two products, so an assertion pinned to it measured
  whether the model guessed which one. Asking is the correct behaviour and
  was scored as a failure.

turns:
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}
  - say: now show me black heels
    expect: {products_min: 1}
  - say: and a black bag
    expect: {products_min: 1}
  # Six black bags were shown a turn ago and every one of them is one size, so
  # a size 8 cannot mean any of them. The black heels are the only thing shown
  # that takes one, and the shopper's own size settles it -- so this resolves
  # rather than asks. Demanding a question here asked the assistant to ignore
  # the one fact that made the reference unambiguous.
  - say: add the black one in a size 8
    expect:
      any_of:
        # When the size narrows it to one it resolves: six black bags shown a
        # turn earlier are all cut one-size, so a size 8 cannot mean any of
        # them and the black heels are the only thing left that takes one.
        - cart:
            - {name: Polished Pearl Pumps, size: "8", qty: 1}
        # When black dresses in a size 8 are on screen too, several fit and
        # nothing the shopper said tells them apart, so it asks. Which of the
        # two happens depends on what the earlier searches returned, so the
        # script cannot name one without scoring the other wrong.
        - cart_unchanged: true
          reply_asks: true
  - say: the Polished Pearl Pumps
    expect: {}
  - say: size 8
    expect:
      cart: [{name: Polished Pearl Pumps, size: "8", qty: 1}]
  - say: what's in my cart
    expect:
      cart: [{name: Polished Pearl Pumps, size: "8", qty: 1}]
