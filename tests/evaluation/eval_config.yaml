version: 1

challenger_model:
  provider: openai_compatible
  base_url_env: "CHALLENGER_MODEL_BASE_URL"
  model_env: "CHALLENGER_MODEL_NAME"
  api_key_env: "CHALLENGER_MODEL_API_KEY"
  base_url: null
  model: null
  api_key_required: false
  disable_thinking: false
  json_mode: true
  temperature: 1.0
  max_tokens: 512
  timeout_seconds: 45

judge_model:
  enabled: false
  provider: openai_compatible
  base_url_env: "JUDGE_MODEL_BASE_URL"
  model_env: "JUDGE_MODEL_NAME"
  api_key_env: "JUDGE_MODEL_API_KEY"
  base_url: null
  model: null
  api_key_required: false
  disable_thinking: false
  json_mode: true
  temperature: 1.0
  max_tokens: 2048
  timeout_seconds: 60
  rules_file: "judge_rules.md"

target_agent:
  base_url: "http://localhost:8009"
  endpoint: "/query/timing"
  # Must exceed the target's turn budget with room for transport, or the client
  # aborts turns the assistant would have completed.
  timeout_seconds: 120
  guardrails: false

run:
  # Diagnostic fields recorded on every turn. Named explicitly: the recorded
  # turn is the contract a judge adjudicates against, so a field belongs here
  # when a judge needs it to verify a claim or an operator needs it to explain
  # a failure. Requires EXPOSE_AGENT_DIAGNOSTICS=true on the target.
  recorded_diagnostics:
    - product_evidence
    - product_evidence_truncated
    - catalog_scope_outcomes
    - tool_calls
    - skill_files_read
    - rejected_tool_calls
    - duplicate_tool_calls
    - final_termination_reason
  datasets:
    - text_shopping
    - style_guide
  scenario_limit_per_dataset: 10
  random_seed: 7
  save_returned_images: true
  send_asset_descriptions_to_agent: false
  compare_to: null

conversation:
  default_turns: 8
  min_turns: 6
  max_turns: 10
  stop_when_goal_complete: true
