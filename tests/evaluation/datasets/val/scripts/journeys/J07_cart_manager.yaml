id: J07_cart_manager
covers: [cart-management, sizes, references]
why: >
  Adding, changing and removing across a long conversation. A size change must
  never leave the cart emptier than it started, and the readback must match the
  cart rather than the assistant's memory of it.
turns:
  - say: show me some heels
    expect: {products_min: 2}
  - say: add the Polished Pearl Pumps in a 7
    expect:
      cart: [{name: Polished Pearl Pumps, size: "7", qty: 1}]
  - say: show me some tote bags
    expect: {products_min: 2}
  - say: add the Ombre Canvas Tote Bag
    expect:
      cart:
        - {name: Polished Pearl Pumps, size: "7", qty: 1}
        - {name: Ombre Canvas Tote Bag, qty: 1}
  - say: what's in my cart
    expect:
      cart:
        - {name: Polished Pearl Pumps, size: "7", qty: 1}
        - {name: Ombre Canvas Tote Bag, qty: 1}
  - say: change the heels to an 8
    expect: {}
  - say: remove the tote bag
    expect: {}
  - say: what's in my cart now
    expect: {}
  - say: actually add the tote bag back
    expect: {}
  - say: and what's the total
    expect: {}
