set_name: Model-owned direct alternatives
queries:
  - >-
    For a semi-formal dinner, show me heels or flats so I can compare the two
    footwear directions.
answers:
  - >-
    Treat heels and flats as one model-owned alternative set under the advertised
    footwear category. Run one catalog search over both advertised subcategories,
    present grounded candidates under their actual catalog types, and distinguish
    styling judgment from verified product facts.
diagnostic_expectations:
  - required_skills: [outfit-styling]
    required_tools: [search_catalog_tool]
    tool_call_counts:
      search_catalog_tool: 1
    tool_call_expectations:
      - tool_name: search_catalog_tool
        status: completed
        arguments:
          taxonomy:
            category: [footwear]
            subcategory: [heels, flats]
          required_constraints: {}
