set_name: Event-context prior-product comparison
shopper_profile_id: shopper_jordan
queries:
  - "I’m shopping for a semi-formal wedding"
  - "NYC, on an outdoor patio next week."
  - "Ok can you compare the lacy gown and the hem satin dress"
answers:
  - >-
    Treat the occasion alone as a request to start shopping, not as a request
    for a complete multi-role look. Run one catalog search for one useful core
    role and present grounded candidates from that role. Use the saved ZIP only
    as a tentative event-location candidate: ask one natural question framed
    around whether the wedding is in the shopper's usual area or elsewhere,
    never a bare where, city, or destination question. Defer venue setting
    rather than combining it into this response. Do not echo ZIP digits, infer
    weather or venue, ask about dress code, or claim unverified product
    performance.
  - >-
    Treat this as fulfillment of the prior event-context question, not as a new
    product or refinement request. Retain the prior grounded candidates and run
    no new catalog search. Use NYC as the shopper-provided event location
    without inventing a ZIP, resolve "next week" deterministically to the next
    calendar Monday-through-Sunday range, and call weather exactly once. State
    the provider-resolved forecast location as a transparent assumption, give
    concise patio-relevant styling guidance grounded only in the returned
    forecast evidence, include the clickable "Weather Data Provided by Visual
    Crossing" attribution and forecast-can-change warning, and ask no repeated
    location, ZIP, venue, or date question. Do not claim that a candidate has
    unverified weather, comfort, or performance properties.
  - >-
    Treat this as an explicit comparison inside the active outfit-styling and
    event thread, not as another search. Resolve the Intricate Lace Gown and
    Wavy Hem Satin Dress from the durable prior-product index in one batched
    call, then read current catalog details for both before comparing them.
    Do not refresh weather merely because the shopper asks for a product
    comparison; the established event goal may guide styling judgment without
    reusing prior forecast facts. Compare only confirmed prices, categories,
    and product-detail facts, distinguish styling judgment from catalog facts,
    disclose material gaps, and make a concise choice for the stated occasion.
    Run no catalog search and ask no repeated location, venue, or date question.
diagnostic_expectations:
  - required_skills: [outfit-styling, event-context]
    required_tools: [search_catalog_tool]
    forbidden_tools:
      - get_weather_forecast_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    tool_call_counts:
      search_catalog_tool: 1
    weather_tool_calls: 0
  - required_skills: [outfit-styling, event-context]
    required_tools: [get_weather_forecast_tool]
    forbidden_tools:
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    tool_call_counts:
      get_weather_forecast_tool: 1
      search_catalog_tool: 0
    weather_tool_calls: 1
  - required_skills: [outfit-styling, event-context]
    required_tools:
      - resolve_conversation_products_tool
      - get_product_details_tool
    forbidden_tools:
      - search_catalog_tool
      - get_weather_forecast_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    tool_call_counts:
      resolve_conversation_products_tool: 1
      get_product_details_tool: 2
      search_catalog_tool: 0
      get_weather_forecast_tool: 0
    weather_tool_calls: 0
    required_product_detail_names:
      - Intricate Lace Gown
      - Wavy Hem Satin Dress
