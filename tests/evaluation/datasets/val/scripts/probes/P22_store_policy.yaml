id: P22_store_policy
covers: [store-policy-answers, honesty]
why: >
  A policy answer that is not held must not be invented. Shipping dates, tax
  and stock are exactly the facts the assistant is most tempted to supply.
turns:
  - say: what's your returns policy, and when would something arrive if I ordered today
    expect:
      products_max: 0
      cart_unchanged: true
