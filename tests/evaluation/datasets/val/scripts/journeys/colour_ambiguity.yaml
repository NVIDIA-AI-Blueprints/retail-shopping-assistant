id: colour_ambiguity
covers: [references, cart-management, discovery]
why: >
  A conversation full of black things. "The black one" is a description that
  fits several, and the assistant used to pick one silently -- reaching
  fourteen turns back for a navy dress in half the runs.
turns:
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}
  - say: now show me black heels
    expect: {products_min: 1}
  - say: and a black bag
    expect: {products_min: 1}
  - say: add the black one in a size 8
    expect: {cart_unchanged: true}
  - say: the Polished Pearl Pumps
    expect: {}
  - say: size 8
    expect:
      cart: [{name: Polished Pearl Pumps, size: "8", qty: 1}]
  - say: what's in my cart
    expect:
      cart: [{name: Polished Pearl Pumps, size: "8", qty: 1}]
