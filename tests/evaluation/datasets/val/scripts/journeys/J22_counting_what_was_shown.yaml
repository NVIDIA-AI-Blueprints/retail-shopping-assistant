id: J22_counting_what_was_shown
covers: [discovery, references, cart]
why: >
  A showing of more than one kind, and then the shopper counting inside it.
  Numbering restarts under each heading, so "the first one" and "the second
  shoes" mean different products and neither is the second thing on the
  screen. Nothing else in this suite asks for a number over a showing with
  more than one group: the ordinal adds in J15 all happen where only one kind
  is on screen, which is exactly where per-group and straight-through
  numbering give the same answer and a mistake cannot show.

  Sizes are stated with each add. A sized garment with no size is a question
  the assistant is right to ask, and leaving it out tested that instead of
  what this is for.
turns:
  - say: show me some dresses and some shoes for a summer wedding
    expect: {products_min: 2}
  # A bare ordinal, asked before anything has narrowed which kind is in play.
  # It must not stop to ask: the first group is the one the reply anchors on,
  # and a shopper who says "the first one" has not been unclear. Asked later
  # in the conversation this would be a different question -- two turns about
  # shoes and "the first one" means the first shoes -- so it is asked here,
  # where only the default can answer it.
  - say: add the first one to my cart, in a 6
    expect:
      cart_lines: 1
      cart_holds_shown: {turn: 1, position: 1}
  # Named, so the group decides which number this is. The second shoes is the
  # second of the shoes, not the second thing shown -- and the shoes may have
  # arrived as several scopes, which is why the heading and not the category
  # is what the number counts under.
  - say: add the second shoes too, in a 7
    expect:
      cart_lines: 2
      cart_holds_shown: {turn: 1, group: shoes, position: 2}
  - say: what's in my cart
    expect:
      cart_unchanged: true
      cart_lines: 2
