id: P19_reference_ordinal
covers: [references]
why: >
  "That first one" names no product. It is answerable only from the position
  the record stored when the products were shown.
turns:
  - say: show me some tote bags
    expect:
      products_min: 2
      every_product: {subcategory: tote_bags}
  - say: what is the first one made of
    expect:
      cart_unchanged: true
