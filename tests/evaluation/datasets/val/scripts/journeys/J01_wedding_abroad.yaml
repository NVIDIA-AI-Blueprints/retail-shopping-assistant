id: J01_wedding_abroad
covers: [weather, outfit-styling, references, cart-management, sizes, honesty]
why: >
  The demo conversation, and the one that found most of this week's bugs. A
  shopper arrives with an occasion and no product in mind, and by turn nineteen
  the assistant must still know which dress "the black one" means. It once
  reached fourteen turns back for a navy one.
  Names Jade Suede Heels, not Polished Pearl Pumps: this catalog gives that
  second name to two products, so every assertion pinned to it measured
  whether the model guessed rather than what this journey is for. The
  assistant asking which pair is correct, and was scored as a failure.

turns:
  - say: I have a wedding to go to and I need something to wear
    expect: {products_min: 1}
  - say: it's in Cancun around mid next week
    expect: {products_min: 1}
  - say: is it on a beach? what shoes work
    expect: {products_min: 1}
  # The catalog holds no outerwear, but it does hold eighteen sweaters, so a
  # cooler evening has a real answer here. An earlier version of this file
  # claimed there were none and used that to excuse showing nothing.
  # Both things must hold: something is shown, and styling talk alone never
  # reaches the cart.
  - say: I need something for the evening too, it might be cooler
    expect:
      products_min: 1
      cart_unchanged: true
  - say: show me some heels
    expect: {products_min: 2}
  - say: add the Jade Suede Heels to my cart
    expect: {cart_unchanged: true}
  - say: size 7
    expect:
      cart: [{name: Jade Suede Heels, size: "7", qty: 1}]
  - say: actually add them in an 8 as well
    expect:
      cart:
        - {name: Jade Suede Heels, size: "7", qty: 1}
        - {name: Jade Suede Heels, size: "8", qty: 1}
  - say: do you have a green dress in a size 2
    expect: {}
  # High-neck, because "the black one" nine turns later has to mean one dress.
  # Plain "black dresses in a size 2" shows four, and pinning one of them in the
  # cart assertion below measured whether the model guessed right out of four --
  # while asking which, the correct behaviour, scored as a failure. Only means
  # only is still what this turn tests.
  - say: show me ONLY black high-neck dresses in a size 2, don't show me anything else
    expect:
      products_min: 1
      every_product: {primary_color: black}
  - say: do you have a tote bag in a size 8
    expect: {}
  - say: my husband is coming too, he needs sunglasses
    expect: {products_min: 1}
  - say: he also wants a bag for the trip
    expect: {products_min: 1}
  - say: now show me some skirts
    expect: {products_min: 2}
  - say: we're going to Italy first, what do I wear at the weekend
    expect: {}
  - say: Florence
    expect: {}
  - say: and there's another wedding in Cancun in about three months
    expect: {}
  - say: it's going to snow when we get back, what should I wear
    expect: {}
  # The hardest reference in this journey. Boots were shown one turn ago and one
  # of them is black, but footwear runs 5-9, so "in a 2" can only mean the black
  # dress from nine turns earlier -- and after the narrowing above there is
  # exactly one of those. Resolving that is the ability being tested; adding a
  # boot would be wrong, and so would asking, because only one candidate fits.
  - say: add the black one in a 2 and show me a clutch to go with it
    expect:
      cart:
        - {name: Jade Suede Heels, size: "7", qty: 1}
        - {name: Jade Suede Heels, size: "8", qty: 1}
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}
  - say: what's in my cart
    expect:
      cart_unchanged: true
      cart:
        - {name: Jade Suede Heels, size: "7", qty: 1}
        - {name: Jade Suede Heels, size: "8", qty: 1}
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}
