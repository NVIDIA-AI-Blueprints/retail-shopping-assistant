services:

  nemotron:
    image: nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:2.0.4
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_PASSTHROUGH_ARGS=--enable-auto-tool-choice --tool-call-parser pythonic --max-num-seqs 256
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0','1']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  nvclip:
    image: nvcr.io/nim/nvidia/nvclip:2.0.0
    ports:
      - "8002:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  nemotron-omni:
    image: nvcr.io/nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:latest
    ports:
      - "8005:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    shm_size: "32gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0','1']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  embedqa:
    # Per the published self-hosted deploy for nemotron-3-embed-1b:
    #   https://build.nvidia.com/nvidia/nemotron-3-embed-1b/deploy?nim=self-hosted
    image: nvcr.io/nim/nvidia/nemotron-3-embed-1b:latest
    shm_size: "16gb"
    ports:
      - "8001:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
  content:
    image: nvcr.io/nim/nvidia/llama-3.1-nemoguard-8b-content-safety:1.10.1
    ports:
      - "8003:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_KVCACHE_PERCENT=.4
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

  topic_control:
    image: nvcr.io/nim/nvidia/llama-3.1-nemoguard-8b-topic-control:1.0.0
    ports:
      - "8004:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_KVCACHE_PERCENT=.4
    volumes:
      - ${LOCAL_NIM_CACHE}:/opt/nim/.cache
    user: "${NIM_UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network

networks:
  shopping-network:
    driver: bridge
    name: retail-shopping-assistant_shopping-network
