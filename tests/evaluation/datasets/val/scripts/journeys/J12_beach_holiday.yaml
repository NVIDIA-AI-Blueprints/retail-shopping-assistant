id: J12_beach_holiday
covers: [weather, outfit-styling, discovery, cart-management, sizes]
why: >
  A dated destination, then a whole holiday wardrobe built across turns. A
  forecast must come with clothes, and must confirm nothing about any product:
  sun does not make a fabric breathable.
turns:
  - say: I'm going to Cancun next week, what's the weather like
    # A city, a window, and inside the horizon, with nothing to search. This
    # was unchecked, and every run answered it with "I don't have a live
    # weather forecast" followed by a description of a typical Cancun
    # September -- a refusal and the invention the refusal exists to prevent.
    expect: {tools_used: [get_weather_forecast_tool]}
  - say: what should I pack
    expect: {products_min: 1}
  - say: I need sandals for the beach
    expect: {products_min: 1}
  - say: something for dinner in the evening
    expect: {products_min: 1}
  - say: and sunglasses
    expect:
      products_min: 1
      every_product: {subcategory: sunglasses}
  - say: add the Xenial Aviator Sunglasses
    expect:
      cart: [{name: Xenial Aviator Sunglasses, qty: 1}]
  - say: a bag I can carry to the beach
    # A bag, not a kind of bag, so which kinds come back is the model's call
    # and has varied run to run. What may not vary is that they are bags.
    expect:
      products_min: 1
      products_within:
        [tote_bags, crossbody_bags, shoulder_bags, satchels, travel_bags]
  - say: add the Linen Canvas Tote Bag too
    expect:
      cart:
        - {name: Xenial Aviator Sunglasses, qty: 1}
        - {name: Linen Canvas Tote Bag, qty: 1}
  - say: will I need a jacket in the evening
    # Nine turns into one trip to one city: the place and the dates are both
    # known, so there is no honest sense in which a forecast is unavailable.
    # Also unchecked, and also answered with "I don't have a live forecast for
    # Cancun" and then a description of the evenings there.
    expect: {tools_used: [get_weather_forecast_tool]}
  - say: what's in my cart
    expect:
      cart:
        - {name: Xenial Aviator Sunglasses, qty: 1}
        - {name: Linen Canvas Tote Bag, qty: 1}
