id: P05_cart_readback
covers: [cart-management]
why: >
  What the assistant says is in the cart must be what is in the cart. A run
  once reported no failures while a dress had gone missing entirely.
turns:
  - say: show me some bracelets
    expect:
      products_min: 2
  - say: add the Southwest Bracelet
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
  - say: what's in my cart
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
