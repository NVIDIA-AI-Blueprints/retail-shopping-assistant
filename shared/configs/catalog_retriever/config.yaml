db_port: "http://milvus:19530" 
db_name: "shopping_advisor_db"
catalog_id: "fashion_products_extended"
sim_threshold: 0.3
text_collection: "shopping_advisor_text_db"
image_collection: "shopping_advisor_image_db"
#data_source: "/app/shared/data/products.csv"
data_source: "/app/shared/data/products_extended.csv"
filter_registry:
  category:
    type: "enum"
    source_fields:
      - "subcategory"
    operators:
      - "in"
  price:
    type: "number"
    source_fields:
      - "price"
    operators:
      - "gte"
      - "lte"
    request_aliases:
      min: "min_price"
      max: "max_price"
soft_facets:
  color:
    type: "text"
  material:
    type: "text"
  style:
    type: "text"
  occasion:
    type: "text"
  formality:
    type: "text"
