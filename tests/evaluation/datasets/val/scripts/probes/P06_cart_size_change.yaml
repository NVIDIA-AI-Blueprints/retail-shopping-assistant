id: P06_cart_size_change
covers: [cart-management, sizes]
why: >
  A size is a different line, not a different quantity. With no operation for
  the change the model once reached for quantity zero, which deleted the line
  and never replaced it - the shopper was told their cart was empty.
  Names Jade Suede Heels, not Polished Pearl Pumps: this catalog gives that
  second name to two products, so an assertion pinned to it measured
  whether the model guessed which one. Asking is the correct behaviour and
  was scored as a failure.

turns:
  - say: show me some heels
    expect:
      products_min: 2
  - say: add the Jade Suede Heels in a 7
    expect:
      cart:
        - {name: Jade Suede Heels, size: "7", qty: 1}
  - say: actually make that an 8
    expect:
      cart:
        - {name: Jade Suede Heels, size: "8", qty: 1}
