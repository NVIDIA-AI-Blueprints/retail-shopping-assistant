id: gift_shopping
covers: [cart-management, sizes, discovery, references]
why: >
  Jewellery and eyewear are one size, so nothing here should ever be asked what
  size it is -- a question that reads as broken to a shopper buying a bracelet.
turns:
  - say: I'm buying a gift, show me some jewellery
    expect: {products_min: 2}
  - say: what bracelets do you have
    expect:
      products_min: 2
      every_product: {subcategory: bracelets}
  - say: add the Southwest Bracelet
    expect:
      cart: [{name: Southwest Bracelet, qty: 1}]
  - say: show me necklaces too
    expect: {products_min: 1}
  - say: and earrings
    expect: {products_min: 1}
  - say: add two of the Xenial Aviator Sunglasses as well
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
        - {name: Xenial Aviator Sunglasses, qty: 2}
  - say: what's in my cart
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
        - {name: Xenial Aviator Sunglasses, qty: 2}
