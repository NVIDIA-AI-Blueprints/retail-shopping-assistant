id: J03_indecisive_shopper
covers: [references, cart-management, sizes, memory]
why: >
  Every kind of reference in one conversation -- ordinal, pronoun, partial
  name and full name.
  Names Jade Suede Heels, not Polished Pearl Pumps: this catalog gives that
  second name to two products, so an assertion pinned to it measured
  whether the model guessed which one. Asking is the correct behaviour and
  was scored as a failure.

turns:
  - say: show me some heels
    expect: {products_min: 2}
  - say: what is the first one made of
    expect: {cart_unchanged: true}
  - say: show me some tote bags too
    expect: {products_min: 2}
  - say: and some bracelets
    expect: {products_min: 2}
  - say: add the Southwest Bracelet
    expect:
      cart: [{name: Southwest Bracelet, qty: 1}]
  - say: actually show me sunglasses
    expect: {products_min: 2}
  - say: add the Xenial Aviator Sunglasses too
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
        - {name: Xenial Aviator Sunglasses, qty: 1}
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}
  # Was "the Jade Suede Heels, in a 7" -- a bare noun phrase with no verb,
  # arriving right after the assistant had asked "please confirm you'd like to
  # proceed". In that position it reads as a redirect, not an instruction to
  # add, and asserting a cart change for it was asking the assistant to infer a
  # command the shopper never gave. The full-name reference is what this turn
  # exists to test, and it still does.
  - say: add the Jade Suede Heels, in a 7
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
        - {name: Xenial Aviator Sunglasses, qty: 1}
        - {name: Jade Suede Heels, size: "7", qty: 1}
  - say: what's in my cart
    expect:
      cart:
        - {name: Southwest Bracelet, qty: 1}
        - {name: Xenial Aviator Sunglasses, qty: 1}
        - {name: Jade Suede Heels, size: "7", qty: 1}
