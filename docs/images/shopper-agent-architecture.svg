<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">Shopper Deep Agent architecture</title>
  <desc id="description">The published catalog feeds a deterministic catalog foundation. Each shopper turn uses request-scoped graph work while one SQLite memory-service replica durably stores turns and presented-product evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #52606d; }
      .section { font: 700 19px Arial, Helvetica, sans-serif; fill: #345e08; letter-spacing: 0.3px; }
      .box-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #17212b; }
      .box-text { font: 400 16px Arial, Helvetica, sans-serif; fill: #3e4c59; }
      .arrow-label { font: 600 14px Arial, Helvetica, sans-serif; fill: #52606d; }
      .note { font: 400 15px Arial, Helvetica, sans-serif; fill: #52606d; }
      .panel { fill: #f7f9f5; stroke: #dce6d5; stroke-width: 2; }
      .built { fill: #ffffff; stroke: #5a940e; stroke-width: 3; }
      .built-bar { fill: #76b900; }
      .flow { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-both { fill: none; stroke: #52606d; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>

  <text x="70" y="56" class="title">Shopper Deep Agent Architecture</text>
  <text x="70" y="86" class="subtitle">Published catalog truth → mandatory skills → deterministic tools → grounded response + durable product continuity</text>
  <circle cx="1422" cy="55" r="7" fill="#76b900"/>
  <text x="1438" y="61" class="note">Built</text>

  <rect x="50" y="112" width="1500" height="270" rx="18" class="panel"/>
  <text x="78" y="148" class="section">1 · PUBLISHED CATALOG DATA FOUNDATION</text>

  <g>
    <rect x="85" y="174" width="300" height="158" rx="14" class="built"/>
    <rect x="85" y="174" width="300" height="9" rx="4" class="built-bar"/>
    <text x="235" y="214" text-anchor="middle" class="box-title">Published catalog</text>
    <text x="235" y="244" text-anchor="middle" class="box-text">
      <tspan x="235" dy="0">Product JSONL</tspan>
      <tspan x="235" dy="24">Field-role sidecar</tspan>
      <tspan x="235" dy="24">Operator-owned product truth</tspan>
    </text>
  </g>

  <g>
    <rect x="470" y="160" width="470" height="186" rx="14" class="built"/>
    <rect x="470" y="160" width="470" height="9" rx="4" class="built-bar"/>
    <text x="705" y="202" text-anchor="middle" class="box-title">Catalog data foundation</text>
    <text x="705" y="232" text-anchor="middle" class="box-text">
      <tspan x="705" dy="0">Validated snapshot + lifecycle fingerprint</tspan>
      <tspan x="705" dy="24">Published capabilities + product details</tspan>
      <tspan x="705" dy="24">Milvus candidate indexes</tspan>
      <tspan x="705" dy="24">Deterministic filtering and normalized ranking</tspan>
    </text>
  </g>

  <g>
    <rect x="1025" y="174" width="465" height="158" rx="14" class="built"/>
    <rect x="1025" y="174" width="465" height="9" rx="4" class="built-bar"/>
    <text x="1258" y="214" text-anchor="middle" class="box-title">Catalog evidence boundary</text>
    <text x="1258" y="244" text-anchor="middle" class="box-text">
      <tspan x="1258" dy="0">Exact advertised taxonomy and filters</tspan>
      <tspan x="1258" dy="24">Product refs, facts, prices, and rankings</tspan>
      <tspan x="1258" dy="24">No chat/completion LLM in the catalog</tspan>
    </text>
  </g>

  <path d="M 385 253 L 470 253" class="flow"/>
  <text x="427" y="239" text-anchor="middle" class="arrow-label">publish</text>
  <path d="M 940 253 L 1025 253" class="flow"/>
  <text x="982" y="239" text-anchor="middle" class="arrow-label">serve</text>

  <rect x="50" y="410" width="1500" height="446" rx="18" class="panel"/>
  <text x="78" y="448" class="section">2 · ONE SHOPPER TURN</text>

  <g>
    <rect x="82" y="486" width="250" height="142" rx="14" class="built"/>
    <rect x="82" y="486" width="250" height="9" rx="4" class="built-bar"/>
    <text x="207" y="527" text-anchor="middle" class="box-title">Shopper / API turn</text>
    <text x="207" y="557" text-anchor="middle" class="box-text">
      <tspan x="207" dy="0">Query + conversation_id</tspan>
      <tspan x="207" dy="24">Session + cart identity</tspan>
      <tspan x="207" dy="24">Optional input guardrails</tspan>
    </text>
  </g>

  <g>
    <rect x="382" y="472" width="292" height="170" rx="14" class="built"/>
    <rect x="382" y="472" width="292" height="9" rx="4" class="built-bar"/>
    <text x="528" y="513" text-anchor="middle" class="box-title">Deep Agents runtime</text>
    <text x="528" y="543" text-anchor="middle" class="box-text">
      <tspan x="528" dy="0">Turn context + semantic judgment</tspan>
      <tspan x="528" dy="24">Capability-derived tool schema</tspan>
      <tspan x="528" dy="24">Bounded tool-loop control</tspan>
      <tspan x="528" dy="24">No hard-coded shopper taxonomy</tspan>
    </text>
  </g>

  <g>
    <rect x="724" y="456" width="330" height="202" rx="14" class="built"/>
    <rect x="724" y="456" width="330" height="9" rx="4" class="built-bar"/>
    <text x="889" y="497" text-anchor="middle" class="box-title">Mandatory skill activation</text>
    <text x="889" y="527" text-anchor="middle" class="box-text">
      <tspan x="889" dy="0">Product discovery · Outfit styling</tspan>
      <tspan x="889" dy="24">Budget shopping · Cart management</tspan>
      <tspan x="889" dy="24">Store policy answers</tspan>
      <tspan x="889" dy="24">Role + exact tools_granted</tspan>
      <tspan x="889" dy="24">Selected files + grant union</tspan>
    </text>
  </g>

  <g>
    <rect x="1104" y="444" width="404" height="226" rx="14" class="built"/>
    <rect x="1104" y="444" width="404" height="9" rx="4" class="built-bar"/>
    <text x="1306" y="485" text-anchor="middle" class="box-title">Eleven-tool registry · selected subset</text>
    <text x="1306" y="515" text-anchor="middle" class="box-text">
      <tspan x="1306" dy="0">Catalog: search · details · availability</tspan>
      <tspan x="1306" dy="24">Memory: exact product resolver</tspan>
      <tspan x="1306" dy="24">Cart: read · total · add · remove · update</tspan>
      <tspan x="1306" dy="24">Read boundaries: promotions · policy</tspan>
      <tspan x="1306" dy="24">Frontmatter + policy bind visibility</tspan>
      <tspan x="1306" dy="24">Dispatch rechecks grants before handlers</tspan>
    </text>
  </g>

  <g>
    <rect x="382" y="704" width="672" height="120" rx="14" class="built"/>
    <rect x="382" y="704" width="672" height="9" rx="4" class="built-bar"/>
    <text x="718" y="745" text-anchor="middle" class="box-title">Conversation state</text>
    <text x="718" y="775" text-anchor="middle" class="box-text">
      <tspan x="718" dy="0">SQLite turns + presented cards + exact resolver · one replica</tspan>
      <tspan x="718" dy="24">Graph MemorySaver · request-scoped working state</tspan>
    </text>
  </g>

  <g>
    <rect x="1104" y="704" width="404" height="120" rx="14" class="built"/>
    <rect x="1104" y="704" width="404" height="9" rx="4" class="built-bar"/>
    <text x="1306" y="745" text-anchor="middle" class="box-title">Grounding boundary</text>
    <text x="1306" y="775" text-anchor="middle" class="box-text">
      <tspan x="1306" dy="0">Tool-role evidence → shopper response</tspan>
      <tspan x="1306" dy="24">Finalize turn · delete request checkpoint</tspan>
    </text>
  </g>

  <path d="M 332 557 L 382 557" class="flow"/>
  <text x="357" y="543" text-anchor="middle" class="arrow-label">request</text>
  <path d="M 674 557 L 724 557" class="flow"/>
  <text x="699" y="543" text-anchor="middle" class="arrow-label">first</text>
  <path d="M 1054 557 L 1104 557" class="flow"/>
  <text x="1079" y="535" text-anchor="middle" class="arrow-label">then</text>

  <path d="M 1258 332 L 1258 410 Q 1258 425 1273 425 L 1306 425 L 1306 444" class="flow"/>
  <text x="1338" y="406" text-anchor="middle" class="arrow-label">catalog contract + evidence</text>

  <path d="M 528 642 L 528 704" class="flow-both"/>
  <text x="450" y="681" text-anchor="middle" class="arrow-label">start / load / finalize</text>
  <path d="M 1160 670 L 1160 686 L 600 686 L 600 704" class="flow-both"/>
  <path d="M 1370 670 L 1370 704" class="flow"/>
  <text x="1430" y="692" text-anchor="middle" class="arrow-label">evidence</text>

  <path d="M 1104 797 L 1080 797 Q 1070 797 1070 842 L 207 842 Q 162 842 162 797 L 162 628" class="flow"/>
  <text x="260" y="836" class="arrow-label">grounded response · next turn retains conversation scope</text>

  <text x="70" y="892" class="note">Built: exact same-conversation product resolution. Not built: cross-conversation memory, fuzzy matching, preferences, or multi-replica durable state.</text>
</svg>
