id: photo_then_build
covers: [media, discovery, outfit-styling, cart-management]
why: >
  A photo starts the conversation and the outfit is built around it over
  several turns. What the camera read is the model's reading, not the
  shopper speaking and not a catalog fact.
turns:
  - say: I like this, can you find me something similar
    attach: Black_dress.jpeg
    expect: {products_min: 1}
  - say: what would you wear with it
    expect: {products_min: 1}
  - say: shoes as well
    expect: {products_min: 1}
  - say: is any of that under $100
    expect: {}
  - say: show me the tote bags again
    expect: {products_min: 2}
  - say: add the Jade Tone Canvas Tote Bag
    expect:
      cart: [{name: Jade Tone Canvas Tote Bag, qty: 1}]
  - say: what's in my cart
    expect:
      cart: [{name: Jade Tone Canvas Tote Bag, qty: 1}]
