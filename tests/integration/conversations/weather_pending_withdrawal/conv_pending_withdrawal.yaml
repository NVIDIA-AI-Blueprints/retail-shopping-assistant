set_name: Pending weather answer with explicit counterpart withdrawal
shopper_profile_id: shopper_jordan
queries:
  - >-
    I’m planning weather-aware styling for an outdoor conference on Sunday
    next week, but I haven’t chosen the city yet. I’m not shopping for products.
  - "Seattle, but the date is undecided now."
  - "Saturday next week."
answers:
  - >-
    Establish only the conference date from the current turn. Do not import the
    profile ZIP or another subject as the event location. Ask one natural
    question for the conference location, and make no weather or catalog call.
  - >-
    Treat Seattle as current location authority and the explicit date
    withdrawal as current date authority. Preserve location=set and
    window=clear even if pending resolution incorrectly classifies this as a
    location-only answer. Ask only for the new date. Do not call or reuse
    weather, search the catalog, or mention the old forecast date.
  - >-
    Treat Saturday next week as the answer to the outstanding date question.
    Retain Seattle, set this new date rather than the withdrawn Sunday, call
    weather exactly once, and give concise outdoor conference guidance grounded
    in that forecast. Ask no further context question and do not search for
    products.
diagnostic_expectations:
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: event_location
    required_weather_scope:
      scope_revision: 0
      location_action: clear
      window_action: set
      location_source: null
      location_supplied: false
      date_supplied: true
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_business_sequence: []
    forbidden_tools:
      - get_weather_forecast_tool
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 0
    required_response_phrases: ["?"]
    forbidden_response_phrases:
      - Weather Data Provided by Visual Crossing
      - "°F"
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: event_date
    required_weather_scope:
      scope_revision: 1
      location_action: set
      window_action: clear
      location_source: shopper_provided_location
      location_supplied: true
      date_supplied: false
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_business_sequence: []
    forbidden_tools:
      - get_weather_forecast_tool
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 0
    required_response_phrases: ["?"]
    forbidden_response_phrases:
      - Weather Data Provided by Visual Crossing
      - "°F"
      - Sunday next week
      - temperature
      - rain
  - required_skills: [outfit-styling, event-context]
    required_event_context_next_question: none
    required_weather_scope:
      scope_revision: 2
      location_action: retain
      window_action: set
      location_source: null
      location_supplied: false
      date_supplied: true
    forbidden_skills:
      - product-discovery
      - budget-shopping
      - cart-management
      - store-policy-answers
    required_tools: [get_weather_forecast_tool]
    required_business_sequence: [get_weather_forecast_tool]
    forbidden_tools:
      - search_catalog_tool
      - resolve_conversation_products_tool
      - get_product_details_tool
      - check_product_availability_tool
      - check_active_promotions_tool
    weather_tool_calls: 1
    required_weather_trace:
      request_shape: relative_exact_date
      location_source: shopper_provided_location
      provider_input: location_query
      outcome: success
    required_weather_receipt_status: promotion_prepared
    required_response_phrases:
      - Seattle
      - Weather Data Provided by Visual Crossing
    forbidden_response_phrases:
      - NYC
