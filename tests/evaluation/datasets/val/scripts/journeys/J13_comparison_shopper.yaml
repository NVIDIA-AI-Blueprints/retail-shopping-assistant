id: J13_comparison_shopper
covers: [discovery, memory, honesty, cart-management]
why: >
  A shopper who compares before buying, which is where invention is most
  tempting: material, care and dimensions are catalog facts and must be read,
  not recalled. A price quoted from an earlier turn is history, not a current
  claim. And "which is better value" is judgement -- it may be given, but not
  dressed up as a fact the catalog confirmed.
turns:
  - say: show me black dresses
    expect:
      products_min: 2
      every_product: {primary_color: black}

  - say: what are the first two made of
    expect:
      # Materials come off the record. Answering from memory is how a dress
      # acquires a fabric it never had.
      tools_used: [get_product_details_tool]
      cart_unchanged: true

  - say: how do I care for them
    expect:
      cart_unchanged: true

  - say: which is better value if I wear it every week
    expect:
      # Judgement is allowed here. Buying on the shopper's behalf is not.
      cart_unchanged: true

  - say: what am I giving up with the cheaper one
    expect:
      cart_unchanged: true

  - say: what did the first one cost again
    expect:
      cart_unchanged: true

  - say: are either of them available in a 2
    expect:
      cart_unchanged: true

  - say: ok, add the Black Satin Lace-Up Dress in a 2
    expect:
      cart:
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}

  - say: what's in my cart
    expect:
      cart:
        - {name: Black Satin Lace-Up Dress, size: "2", qty: 1}
