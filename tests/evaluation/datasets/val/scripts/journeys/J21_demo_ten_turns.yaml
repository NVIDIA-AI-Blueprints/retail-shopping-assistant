id: J21_demo_ten_turns
covers: [weather, media, references, discovery, filters, sizes, cart-management, honesty]
why: >
  The recording script. Ten turns chosen so each one shows a different thing the
  assistant can do, in an order a real shopper would follow. Deliberately avoids
  the one colliding product name in this catalog, and avoids sizing one role of
  a multi-role request -- both are known to be unstable and neither is worth
  risking on camera.
turns:
  # 1. A vague opening. It styles for the occasion rather than demanding filters.
  - say: I have a wedding to go to and I need something to wear
    expect:
      products_min: 1

  # 2. A real forecast, with the provider named in the reply.
  - say: it's in Cancun on August 24th
    expect:
      products_min: 1

  # 3. The vision model reads a video and turns it into a search.
  - say: I love this look, can you find me something similar
    attach: casual_lady_fall.mp4
    expect:
      products_min: 1

  # 4. A reference by position, across the media turn.
  - say: tell me more about the second one
    expect:
      tools_used: [resolve_conversation_products_tool]

  # 5. Only means only. No size here on purpose: a size stated as a search
  #    filter can carry into the cart, which would rob turn 6 of its point.
  - say: show me ONLY black dresses, don't show me anything else
    expect:
      products_min: 1
      every_product: {primary_color: black}

  # 6. A sized product cannot enter the cart without a size.
  - say: add the Vivienne Lace Dress to my cart
    expect:
      cart_unchanged: true

  # 7. The size comes from the shopper.
  - say: size 2
    expect:
      cart:
        - {name: Vivienne Lace Dress, size: "2", qty: 1}

  # 8. Two sizes are two lines, not a quantity of two.
  - say: actually add it in a 4 as well
    expect:
      cart:
        - {name: Vivienne Lace Dress, size: "2", qty: 1}
        - {name: Vivienne Lace Dress, size: "4", qty: 1}

  # 9. A one-size product is never asked its size.
  - say: and a tote bag to go with it
    expect:
      products_min: 1

  # 10. The catalog has no waterproof rating. It says so, and still helps.
  - say: do you have waterproof sandals
    expect:
      products_min: 1
