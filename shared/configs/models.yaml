version: 1

local_nims:
  required_env:
    - NGC_API_KEY
    - LOCAL_NIM_CACHE

  services:
    nemotron:
      compose_file: docker-compose-nim-local.yaml
      compose_service: nemotron
      base_url: "http://nemotron:8000/v1"
      model: "nvidia/nemotron-3-super-120b-a12b"

    embedqa:
      compose_file: docker-compose-nim-local.yaml
      compose_service: embedqa
      base_url: "http://embedqa:8000/v1"
      model: "nvidia/nemotron-3-embed-1b"

    nvclip:
      compose_file: docker-compose-nim-local.yaml
      compose_service: nvclip
      base_url: "http://nvclip:8000/v1"
      model: "nvidia/nvclip"

    nemotron_omni:
      compose_file: docker-compose-nim-local.yaml
      compose_service: nemotron-omni
      base_url: "http://nemotron-omni:8000/v1"
      model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

    content_safety_nim:
      compose_file: docker-compose-nim-local.yaml
      compose_service: content-safety
      base_url: "http://content-safety:8000/v1"
      model: "nvidia/nemotron-3.5-content-safety"

    topic_control_nim:
      compose_file: docker-compose-nim-local.yaml
      compose_service: topic-control
      base_url: "http://topic-control:8000/v1"
      model: "nvidia/llama-3.1-nemoguard-8b-topic-control"

models:
  app_llm:
    source: endpoint
    provider: openai_compatible
    base_url_env: LLM_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: LLM_MODEL
    model: "nvidia/nemotron-3-super-120b-a12b"
    api_key_env: LLM_API_KEY

  text_embedding:
    source: endpoint
    provider: openai_compatible
    base_url_env: TEXT_EMBED_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: TEXT_EMBED_MODEL
    model: "nvidia/nemotron-3-embed-1b"
    api_key_env: EMBED_API_KEY

  image_embedding:
    source: endpoint
    provider: openai_compatible
    base_url_env: IMAGE_EMBED_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: IMAGE_EMBED_MODEL
    model: "nvidia/nvclip"
    api_key_env: EMBED_API_KEY

  vlm:
    source: endpoint
    provider: openai_compatible
    local_service: nemotron_omni
    base_url_env: VLM_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: VLM_MODEL
    model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
    api_key_env: VLM_API_KEY

  # This role receives complete video objects for safety evaluation. Images use
  # the purpose-built content_safety model, which does not accept video.
  multimodal_safety:
    source: endpoint
    provider: openai_compatible
    local_service: nemotron_omni
    base_url_env: MULTIMODAL_SAFETY_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: MULTIMODAL_SAFETY_MODEL
    model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
    api_key_env: MULTIMODAL_SAFETY_API_KEY

  content_safety:
    source: endpoint
    provider: nim_guardrails
    local_service: content_safety_nim
    base_url_env: RAILS_CONTENT_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: RAILS_CONTENT_MODEL
    model: "nvidia/nemotron-3.5-content-safety"
    api_key_env: RAIL_API_KEY

  # Prefer the dedicated Topic Control model. Point this role at Content Safety
  # to use the same retail policy through chat_template_kwargs.custom_policy.
  topic_control:
    source: endpoint
    provider: nim_guardrails
    local_service: topic_control_nim
    base_url_env: RAILS_TOPIC_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: RAILS_TOPIC_MODEL
    model: "nvidia/llama-3.1-nemoguard-8b-topic-control"
    api_key_env: RAIL_API_KEY
