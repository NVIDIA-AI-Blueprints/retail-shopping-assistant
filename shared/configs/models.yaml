version: 1

# Locally deployed models: containers on this machine serving an
# OpenAI-compatible endpoint, here vLLM with Hugging Face checkpoints. A role
# uses one with `source: local_model` and `local_service: <name>`.
local_models:
  required_env:
    - HF_TOKEN
    - HF_CACHE

  services:
    local-llm:
      compose_file: docker-compose-model-local.yaml
      compose_service: local-llm
      base_url: "http://local-llm:8000/v1"
      model: "nemotron-3.5-super"

    local-embedding:
      compose_file: docker-compose-model-local.yaml
      compose_service: local-embedding
      base_url: "http://local-embedding:8000/v1"
      model: "nvidia/Nemotron-3-Embed-1B-BF16"

models:
  app_llm:
    source: endpoint
    provider: openai_compatible
    base_url_env: LLM_BASE_URL
    base_url: "https://inference-api.nvidia.com/v1"
    model_env: LLM_MODEL
    model: "nvidia/nvidia/nemotron-3.5-super-vl-preview"
    api_key_env: LLM_API_KEY

  text_embedding:
    source: endpoint
    provider: openai_compatible
    base_url_env: TEXT_EMBED_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: TEXT_EMBED_MODEL
    model: "nvidia/nemotron-3-embed-1b"
    api_key_env: EMBED_API_KEY

  image_embedding:
    source: endpoint
    provider: openai_compatible
    base_url_env: IMAGE_EMBED_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model_env: IMAGE_EMBED_MODEL
    model: "nvidia/nvclip"
    api_key_env: EMBED_API_KEY

  # Media perception for photo and video uploads. The same model as app_llm by
  # default, since it reads images and video; VLM_* points it elsewhere.
  vlm:
    source: endpoint
    provider: openai_compatible
    base_url_env: VLM_BASE_URL
    base_url: "https://inference-api.nvidia.com/v1"
    model_env: VLM_MODEL
    model: "nvidia/nvidia/nemotron-3.5-super-vl-preview"
    api_key_env: VLM_API_KEY

  content_safety:
    source: endpoint
    provider: nim_guardrails
    base_url_env: RAILS_CONTENT_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model: "nvidia/llama-3.1-nemoguard-8b-content-safety"
    api_key_env: RAIL_API_KEY

  topic_control:
    source: endpoint
    provider: nim_guardrails
    base_url_env: RAILS_TOPIC_BASE_URL
    base_url: "https://integrate.api.nvidia.com/v1"
    model: "nvidia/llama-3.1-nemoguard-8b-topic-control"
    api_key_env: RAIL_API_KEY
