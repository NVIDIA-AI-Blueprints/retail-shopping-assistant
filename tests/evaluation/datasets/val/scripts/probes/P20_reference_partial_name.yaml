id: P20_reference_partial_name
covers: [references, cart-management]
why: >
  Shoppers shorten names. "the aviator sunglasses" is a run of one product's
  name and of no other, so it names one thing even though it is not the whole
  name.
turns:
  - say: show me aviator sunglasses
    expect:
      products_min: 2
      every_product: {subcategory: sunglasses}
  - say: add the Xenial Aviator Sunglasses
    expect:
      cart:
        - {name: Xenial Aviator Sunglasses, qty: 1}
