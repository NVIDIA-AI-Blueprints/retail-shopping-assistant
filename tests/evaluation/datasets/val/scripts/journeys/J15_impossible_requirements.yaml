id: J15_impossible_requirements
covers: [discovery, filters, honesty]
why: >
  Requirements the catalog cannot express or cannot satisfy, one after another.
  Each must be disclosed rather than silently vetoed, and the conversation must
  keep moving instead of ending in an apology with the search budget unspent.
turns:
  - say: I need waterproof sandals
    expect: {products_min: 1}
  - say: do you have them in a size 3
    expect: {}
  - say: what about a machine washable silk dress
    expect: {}
  - say: any petite sizing
    expect: {}
  - say: ok, just show me sandals in a 7
    expect: {products_min: 1}
  # An ordinal add. Which sandal it is varies by run, so the line cannot be
  # named here -- but the run knows: turn 5 recorded what it showed, in the
  # order the shopper saw it, so "the first one" has a right answer and it is
  # the first product of that showing.
  #
  # Counting lines was all this asserted, and a cart line is not a resolution:
  # the wrong sandal, or a sandal from three turns earlier, passes it. Nothing
  # in this suite asserted what a reference resolved to, which is how a broken
  # record lookup reached a journey run as an empty cart and no more.
  - say: add the first one
    expect:
      cart_lines: 1
      cart_holds_shown: {turn: 5, position: 1}
  - say: what's in my cart
    expect:
      cart_unchanged: true
      cart_lines: 1
      cart_holds_shown: {turn: 5, position: 1}
