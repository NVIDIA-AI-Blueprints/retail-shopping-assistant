#
# Locally deployed models -- `local_models` in shared/configs/models.yaml --
# served on this machine by vLLM from Hugging Face checkpoints: the app LLM,
# text embedding, and the three guardrail judges.
#
# .env.local-models.example points the app at these services; see
# docs/DEPLOYMENT.md, Local Deployment.

services:

  local-llm:
    # Nemotron 3.5 Super from Hugging Face, served by vLLM with the flags
    # notebook/gpu/deploy.sh uses. app_llm and vlm both point here, as they
    # share one hosted model, so the checkpoint must read images and video.
    #
    # BF16 weights are ~240 GB: four 80 GB GPUs at tensor parallel 4. The first
    # start downloads them into HF_CACHE quietly and can take an hour.
    #
    # Pinned to a release: vLLM before 0.30 does not load this architecture.
    image: ${LOCAL_LLM_VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    # vLLM is started without --api-key, so the host port is loopback only.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command:
      - --model=${LOCAL_LLM_HF_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Super-EA-09112026}
      # The name LLM_MODEL asks for, whichever checkpoint is loaded.
      - --served-model-name=nemotron-3.5-super
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=${LOCAL_LLM_TP:-4}
      - --trust-remote-code
      - --async-scheduling
      - --gpu-memory-utilization=0.85
      - --max-num-seqs=128
      - --max-model-len=32768
      # Float32 SSM state for BF16 and FP8 checkpoints.
      - --mamba-backend=flashinfer
      - --mamba-ssm-cache-dtype=float32
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=nemotron_v3
      # Unlike deploy.sh, no --chat-template-content-format string: that
      # flattens every message to text and drops the image and video parts
      # media perception sends.
      - --enable-prefix-caching
      - --block-size=64
      - --prefix-match-unit=64
      - --mamba-cache-mode=align
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ipc: host
    shm_size: "32gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # A comma-separated list, as many GPUs as LOCAL_LLM_TP.
              device_ids: ['${LOCAL_LLM_GPUS:-0,1,2,3}']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 3600s

  local-embedding:
    # Nemotron 3 Embed 1B from Hugging Face, served by vLLM:
    #   https://huggingface.co/nvidia/Nemotron-3-Embed-1B-BF16
    # The model card validates `vllm serve` on vllm-openai v0.20.0 to v0.24.0.
    # Its /v1/embeddings ignores input_type, so texts arrive without the
    # model's "query: " and "passage: " prefixes.
    image: ${LOCAL_EMBED_VLLM_IMAGE:-vllm/vllm-openai:v0.24.0}
    # vLLM is started without --api-key, so the host port is loopback only.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      # Optional: the model is public. Set, it raises Hugging Face rate limits.
      - HF_TOKEN
    command:
      - --model=nvidia/Nemotron-3-Embed-1B-BF16
      - --host=0.0.0.0
      - --port=8000
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LOCAL_EMBED_GPU:-4}']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  local-content-safety:
    # Nemotron 3.5 Content Safety from Hugging Face, served by vLLM:
    #   https://huggingface.co/nvidia/Nemotron-3.5-Content-Safety
    # The model card validates vLLM 0.11.0 to 0.20.2. The served name matches
    # the hosted model, so RAILS_CONTENT_MODEL is the same either way.
    image: ${LOCAL_CONTENT_SAFETY_VLLM_IMAGE:-vllm/vllm-openai:v0.20.0}
    # vLLM is started without --api-key, so the host port is loopback only.
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      # Optional: the model is public. Set, it raises Hugging Face rate limits.
      - HF_TOKEN
    command:
      - --model=nvidia/Nemotron-3.5-Content-Safety
      - --served-model-name=nvidia/nemotron-3.5-content-safety
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=16384
      - --gpu-memory-utilization=0.85
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LOCAL_CONTENT_SAFETY_GPU:-5}']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s

  local-topic-control:
    # Llama 3.1 NemoGuard 8B Topic Control: a LoRA adapter from Hugging Face on
    # Meta's Llama 3.1 8B Instruct, served by vLLM:
    #   https://huggingface.co/nvidia/llama-3.1-nemoguard-8b-topic-control
    # The base model is gated: HF_TOKEN needs Meta's approval for it.
    #
    # The guardrail service uses its dedicated on-topic/off-topic path only
    # when the model name contains "topic-control", so the adapter's name does.
    image: ${LOCAL_TOPIC_CONTROL_VLLM_IMAGE:-vllm/vllm-openai:v0.20.0}
    # vLLM is started without --api-key, so the host port is loopback only.
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command:
      - --model=meta-llama/Llama-3.1-8B-Instruct
      - --enable-lora
      - --max-lora-rank=8
      - --lora-modules
      - llama-3.1-nemoguard-8b-topic-control=nvidia/llama-3.1-nemoguard-8b-topic-control
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=16384
      - --gpu-memory-utilization=0.85
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LOCAL_TOPIC_CONTROL_GPU:-6}']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s

  local-video-safety:
    # Nemotron 3 Nano Omni from Hugging Face, served by vLLM, judges complete
    # videos including their audio:
    #   https://huggingface.co/nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
    # The model card requires vLLM 0.20.0, whose image lacks the audio
    # packages use_audio_in_video needs, so they are installed at start.
    #
    # BF16 weights are ~66 GB on one 80 GB GPU. If that leaves too little KV
    # cache, set LOCAL_VIDEO_SAFETY_HF_MODEL to the -FP8 checkpoint (~35 GB).
    # The guardrail service sends the Omni-specific video request only when
    # the model name contains "nemotron-3-nano-omni".
    image: ${LOCAL_VIDEO_SAFETY_VLLM_IMAGE:-vllm/vllm-openai:v0.20.0}
    # vLLM is started without --api-key, so the host port is loopback only.
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      # Optional: the model is public. Set, it raises Hugging Face rate limits.
      - HF_TOKEN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python3 -m pip install --quiet "vllm[audio]==0.20.0" &&
        exec vllm serve ${LOCAL_VIDEO_SAFETY_HF_MODEL:-nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16}
        --served-model-name=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
        --host=0.0.0.0
        --port=8000
        --trust-remote-code
        --max-model-len=32768
        --gpu-memory-utilization=0.90
        --video-pruning-rate=0.5
        --reasoning-parser=nemotron_v3
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    ipc: host
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LOCAL_VIDEO_SAFETY_GPU:-7}']
              capabilities: [gpu]
    restart: "no"
    networks:
      - shopping-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 1800s

networks:
  shopping-network:
    driver: bridge
    name: retail-shopping-assistant_shopping-network
