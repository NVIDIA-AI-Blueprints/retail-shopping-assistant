name: Python unit tests

on:
  pull_request:
    paths:
      - ".github/workflows/python-unit-tests.yml"
      - "catalog_retriever/**/*.py"
      - "catalog_retriever/requirements.txt"
      - "chain_server/**/*.py"
      - "chain_server/requirements.txt"
      - "guardrails/**/*.py"
      - "guardrails/src/requirements.txt"
      - "memory_retriever/**/*.py"
      - "memory_retriever/requirements.txt"
      - "shared/**/*.py"
      - "shared/configs/catalog_retriever/*.yaml"
      - "shared/data/*.jsonl"
      - "shared/data/*.schema.yaml"
      - "tests/**/*.py"
      - "tests/pytest.ini"
      - "tests/requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed Python files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      # Repo-wide ruff.toml exists, but the codebase has pre-existing debt
      # (hundreds of findings) that this PR does not take on. Scoping to
      # files changed on this branch enforces the convention on new code
      # without turning every unrelated PR red until that debt is paid down.
      - name: Determine changed Python files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # ruff format --check is intentionally not gated yet: the existing
      # codebase has hundreds of formatting deltas, and reformatting a file
      # incidentally touched by an unrelated change produces a diff that
      # dwarfs and obscures that change. Formatting adoption should be its
      # own dedicated pass.
      - name: Run ruff check on changed files
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Check AGENTS.md config-field references
        run: python scripts/check_agents_md_config_refs.py

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LLM_API_KEY: test-llm-api-key
      EMBED_API_KEY: test-embed-api-key
      RAIL_API_KEY: test-rail-api-key
      NVIDIA_API_KEY: test-nvidia-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-dev.txt

      - name: Run offline unit tests
        working-directory: tests
        run: python -m pytest -q unit
