id: P01_assumed_audience_disclosed
covers: [discovery, honesty]
why: >
  An unscoped search returns womenswear whatever the shopper said, because 177
  of 215 products are womenswear. The shopper is the one party who cannot see
  that nobody chose that.
turns:
  - say: I have a wedding to go to and I need something to wear
    expect:
      products_min: 1
